{% extends "base.html" %}
{% block page_title %}{{ 'Editar' if producto and producto.id else 'Nuevo' }} Producto{% endblock %}
{% block content %}
<div class="max-w-xl animate-fade-in" x-data="productoForm('{{ producto.codigo if producto and producto.codigo else "" }}', {{ producto.id if producto and producto.id else 0 }})">
    <div class="card p-6">
        {% if error %}
        <div class="mb-4 p-4 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm flex items-center gap-3">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Alert si el código está duplicado en tiempo real -->
        <div x-show="codigoDuplicado" x-cloak class="mb-4 p-3 rounded-lg bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-300 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <span x-text="'El código `' + codigo + '` ya pertenece al producto `' + productoExistenteNombre + '`.'"></span>
        </div>

        <form method="post" action="{{ '/productos/' ~ producto.id ~ '/editar' if producto and producto.id else '/productos/nuevo' }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nombre *</label>
                <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required class="input-field" placeholder="Nombre del producto">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Código</label>
                    <input type="text" name="codigo" x-model="codigo" @input.debounce.300ms="verificarCodigo()" class="input-field" :class="codigoDuplicado ? '!border-red-500 !ring-2 !ring-red-500/30' : ''" placeholder="Código de barras o referencia">
                    <p x-show="codigoDuplicado" class="text-xs text-red-500 mt-1 font-medium" x-text="'⚠ Código registrado en: ' + productoExistenteNombre"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Categoría</label>
                    <input type="text" name="categoria" value="{{ producto.categoria if producto else '' }}" class="input-field" placeholder="Categoría">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Descripción</label>
                <textarea name="descripcion" rows="2" class="input-field" placeholder="Descripción del producto...">{{ producto.descripcion if producto else '' }}</textarea>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Precio USD *</label>
                    <input type="number" step="0.01" name="precio_usd" value="{{ producto.precio_usd if producto else '' }}" required class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Costo USD</label>
                    <input type="number" step="0.01" name="costo_usd" value="{{ producto.costo_usd if producto else '0' }}" class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stock</label>
                    <input type="number" name="stock" value="{{ producto.stock if producto else '0' }}" class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stock Mín.</label>
                    <input type="number" name="stock_minimo" value="{{ producto.stock_minimo if producto else '5' }}" class="input-field">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" :disabled="codigoDuplicado" class="btn-primary">Guardar</button>
                <a href="/productos" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function productoForm(codigoInicial, productId) {
    return {
        codigo: codigoInicial || '',
        productId: productId || 0,
        codigoDuplicado: false,
        productoExistenteNombre: '',
        async verificarCodigo() {
            if (!this.codigo.trim()) {
                this.codigoDuplicado = false;
                this.productoExistenteNombre = '';
                return;
            }
            try {
                const res = await fetch(`/api/productos/verificar-codigo?codigo=${encodeURIComponent(this.codigo.trim())}&exclude_id=${this.productId}`);
                const data = await res.json();
                if (data.existe) {
                    this.codigoDuplicado = true;
                    this.productoExistenteNombre = data.nombre;
                } else {
                    this.codigoDuplicado = false;
                    this.productoExistenteNombre = '';
                }
            } catch (e) {
                this.codigoDuplicado = false;
            }
        }
    };
}
</script>
{% endblock %}
