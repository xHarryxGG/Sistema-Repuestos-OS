{% extends "base.html" %}
{% block page_title %}{{ 'Editar' if cliente else 'Nuevo' }} Cliente{% endblock %}
{% block content %}
<div class="max-w-xl animate-fade-in">
    <div class="card p-6">
        <form method="post" action="{{ '/clientes/' ~ cliente.id ~ '/editar' if cliente else '/clientes/nuevo' }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nombre *</label>
                <input type="text" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required class="input-field">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Cédula</label>
                    <input type="text" name="cedula" value="{{ cliente.cedula if cliente else '' }}" class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Teléfono</label>
                    <input type="text" name="telefono" value="{{ cliente.telefono if cliente else '' }}" class="input-field">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" value="{{ cliente.email if cliente else '' }}" class="input-field">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Dirección</label>
                <textarea name="direccion" rows="2" class="input-field">{{ cliente.direccion if cliente else '' }}</textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary">Guardar</button>
                <a href="/clientes" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
